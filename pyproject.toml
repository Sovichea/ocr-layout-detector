[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-layout-detector"
version = "0.1.0"
description = "Lightweight document-region and text-line detector for OCR"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
]

[project.optional-dependencies]
train = [
  "PyMuPDF>=1.24",
  "Pillow>=10.0",
]

test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
